name: CI/CD Pipeline

# =========================================================
# TRIGGERS
# =========================================================
on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: cicd-demo


jobs:

  # =======================================================
  # CI 1: UNIT TEST
  # =======================================================
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run pytest -q


  # =======================================================
  # CI 2: STATIC CODE ANALYSIS / LINT
  # =======================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .


  # =======================================================
  # CI 3: SECURITY STATIC ANALYSIS
  # =======================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Bandit
        run: uv run bandit -r . -x ./tests -ll -s B104


  # =======================================================
  # BUILD + PUBLISH
  # =======================================================
  build-and-publish:
    name: Build and Publish Docker Image

    # Run only on pushes to main, not on pull requests.
    if: github.event_name == 'push'

    # All CI checks must pass first.
    needs:
      - test
      - lint
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest


  # =======================================================
  # CD: DEPLOY
  # =======================================================
  deploy:
    name: Deploy to Render

    if: github.event_name == 'push'

    needs:
      - build-and-publish

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

        run: |
          ENCODED_IMAGE_URL=$(python3 -c \
            'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')

          curl --fail \
            --silent \
            --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENCODED_IMAGE_URL}"