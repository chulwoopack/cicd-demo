[project]
name = "cicd-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chulwoopack", email = "chulwoo.pack@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
