[project]
name = "cicd-demo"
version = "0.1.0"
description = "A simple CI/CD teaching demo"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I",
]